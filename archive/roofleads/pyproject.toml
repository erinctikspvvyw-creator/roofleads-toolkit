[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roofleads"
version = "1.0.0"
description = "Budget-capped CLI that builds a checked list of Texas roofing companies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "dnspython>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
roofleads = "roofleads.cli:console_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
